# Physical data for the tour (pass 3). GM in km^3/s^2 (planets: system values, moons included),
# radii and orbits in km, inclinations and ascending nodes in degrees to the mean ecliptic of
# J2000. Sources: JPL Solar System Dynamics, fetched 2026-11-06: astro_par.html (GM, DE440),
# planets/phys_par.html (mean radii), planets/approx_pos.html Table 1 (orbits, 'with respect to
# the mean ecliptic and equinox of J2000, valid for the time-interval 1800 AD - 2050 AD'),
# sats/phys_par and sats/elem (moons), SBDB (Ceres). 1 AU = 149,597,870.7 km (IAU 2012).

sun:
  gm: {value: 1.32712440041e11, unit: km^3/s^2, conf: "high", source: "JPL SSD astro_par (DE440)"}
earth:
  gm: {value: 398600.4355, unit: km^3/s^2, conf: "high", source: "JPL SSD astro_par (DE440)"}
  radius: {value: 6371.0, unit: km, conf: "high", source: "JPL SSD planets/phys_par, mean radius"}
  orbit: {value: 149598261.0, unit: km, conf: "high", source: "JPL SSD approx_pos Table 1: a = 1.00000261 AU"}
  inclination: {value: 0.0, unit: deg, conf: "high", source: "the ecliptic"}
  node: {value: 0.0, unit: deg, conf: "high", source: "the ecliptic (undefined; no effect at zero inclination)"}
