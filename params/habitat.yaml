# The spinning habitat: a torus (or a stack of tori) spun for gravity, inside a radiation shield
# that does not spin (as in the Stanford torus, NASA SP-413, 1977), so the shield's mass loads
# no structure. People live on a ground plane across the tube and in floors within gravity_band
# of the outer floor's gravity; farms (aeroponic racks) go anywhere in the tube. The tube is the
# smallest that holds the ground, the lived-in volume in the band and the farms (pass 3-4,
# docs/RESEARCH.md). The shield is water for the dose target (Jon's choices, pass 4).

gravity_g:
  value: 1.0
  low: 0.9
  high: 1.0
  unit: g (9.80665 m/s^2) at the outer floor
  conf: "low"
  source: "SP-413 ch. 3: 'humans permanently in space should live between 0.9 g and 1 g'; no human data on long-term partial g (Clement et al. 2015: 'It is not known whether Mars gravity is effective or not'); mice lose bone in proportion to unloading even at 70% load (Ellman et al. 2013), so nothing supports going lower"
rpm:
  value: 1
  unit: revolutions per minute
  conf: "high"
  source: "Jon's decision (2026-11-06): 1 rpm, the hockey ship's spin; faster spin worsens skating along the ring (at 2 rpm a skater at 11 m/s weighs 1.52 with the spin, 0.58 against), slower needs a far bigger, heavier ship. Comfort limits: SP-413 ch. 3: '1 rpm is set as the upper limit of permissible rotation rate for the principal living quarters'; Globus & Hall 2015: 'Up to 2 rpm should be no problem for residents'. Up to 4 rpm may be acceptable with training for visitors (Globus & Hall 2015), but nothing covers children or lifetimes"
gravity_band:
  value: 0.1
  low: 0.06
  high: 0.15
  unit: fraction of floor gravity spanned by the lived-in band (floors from R (1 - band) to R)
  conf: "low"
  source: "SP-413 ch. 3: 'This choice of a 10 percent variation is arbitrary, but also maintains conditions as Earth-like as possible'. Low: Queijo 1988 (NASA CR-181617 sec. 5.2.1), decks +-3% about 1 g, 'This difference is not expected to have any significant influence on human physiology and performance' (6.2% span). High: Jensen 2024 designs over 0.95-1.1 g (13.6%). No physiological data on floor-to-floor gravity: 'It is not known if the gravity gradient has any critical influences on the cardiovascular and neurovestibular systems' (Clement et al. 2015). Head-to-foot gradient at 894 m is 0.0011 g/m, far inside Hall's listed limits (AIAA 99-4524 Table 1)"
ground_area_per_person:
  value: 67
  low: 40
  high: 155
  unit: m^2 of ground (projected area) a person, for living (farms are off the ground)
  conf: "medium"
  source: "Jon's choice (2026-11-06): SP-413's 67 m^2 a person, all of it for living now that the farms are aeroponic racks off the ground (SP-413's 67 had 46.6 community + 20.4 farms). SP-413 ch. 3: 'there should be at least 40 m^2 of projected area per inhabitant. Projected area means area projected onto the largest plane perpendicular to the direction of the pseudogravity'; app. 4B: 'In a torus the projected area is a strip through the diameter of the tube of the torus', Ap = 4 pi r R; ch. 5: 'the central plain running the full circumference of the torus along the middle of the tube' (test_ground_area_reproduces_sp413). High: SP-413's whole floor area 155, Kalpana One's '170m2 living area for each of 3,000 residents' (Globus et al. 2007)"
max_tube_ratio:
  value: 0.2
  low: 0.15
  high: 0.25
  unit: largest tube radius / outer floor radius before adding rings
  conf: "low"
  source: "judgement: SP-413 ch. 4 'The desire to keep structural mass small favors small radii of curvature' (its own 0.073); a cap so a fast-spinning ship stacks rings rather than fattening one tube. At 1 rpm one ring holds the ship well under it"
community_volume_per_person:
  value: 823
  low: 500
  high: 1600
  unit: m^3 of lived-in volume a person in the gravity band (homes, work, community, open space; not farms)
  conf: "medium"
  source: "SP-413 Table 3-2 community subtotal 823.3 m^3 a person (residential 147, public open space 500 at 50 m height, transportation 72, service industry 24, ...); farms (its 915 m^3 of agriculture) are now aeroponic racks sized separately (life.*). Low: SP-428's 518 m^3 of public space at 36.5 m height for a smaller open-space allowance (judgement); high: roomier open space for the extra living ground (judgement)"
interior_mass_per_person:
  value: 31
  low: 20
  high: 50
  unit: t per person (floors, buildings, water, equipment; not the shell, shield or farms)
  conf: "medium"
  source: "SP-413 Table 5-3 'Internal masses': 530,000 t for 10,000 people, of which soil 220,000 t (22 t a person); aeroponic farms use no soil, so 53 - 22 = 31 (farm racks and water are life.farm_mass_per_grow_area). Range a judgement"
air_pressure:
  value: 70
  low: 50.8
  high: 101.3
  unit: kPa
  conf: "medium"
  source: "SP-413 Table 4-3: 50.8 kPa (pO2 22.7, pN2 26.6); NASA exploration atmosphere 56.5 kPa / 34% O2 (Wessel et al. 2018), where '31.4% O2 is the calculated upper limit that would not increase burning rate'; ~70 kPa gives sea-level inspired O2 at <= 30% O2 (pass 1 derivation). La Rinconada (~53 kPa, normal air) shows chronic illness without enrichment (Hancco et al. 2020)"
air_temperature:
  value: 293
  low: 288
  high: 298
  unit: K
  conf: "medium"
  source: "room temperature; sets the air's mass with air_pressure"
min_inertia_ratio:
  value: 1.2
  low: 1.05
  high: 1.5
  unit: spin-axis / largest cross-axis moment of inertia, least allowed
  conf: "medium"
  source: "Globus et al. 2007 (Kalpana One) sec. III: 'Experience with spin-stabilized spacecraft suggests that the desired axis of rotation should have an angular moment of inertia at least 1.2 times greater than any other axis' (citing Brown, Elements of Spacecraft Design, AIAA 2002); Hubert, NASA/TP-2013-217917: 'energy dissipation will cause the vehicle to ultimately converge to a state of simple spin about the major axis' and ratios 'between 0.96 and 1.04 ... are usually considered unacceptable' (low end); high end judgement for flexible structure and moving masses. One SP-413 ring has 1.99"
shell:
  density:
    value: 7850
    unit: kg/m^3
    conf: "high"
    source: "structural steel"
  allowable_stress:
    value: 320
    low: 215
    high: 460
    unit: MPa
    conf: "medium"
    source: "A514-class quenched and tempered steel plate (ASTM A514: 760-895 MPa tensile, 690 MPa minimum yield). Central ASME VIII-2 style min(UTS / 2.4, 2/3 yield) = 317; NASA-STD-5001B Table 5 (habitable modules, 'Internal pressure only': yield factor 1.65, ultimate 2.0) gives 380; low: ASME VIII-1 (UTS / 3.5) 217, or NASA's factors on SP-413's rolled steel 213; high: SP-413 app. 4A's rule, 'A safety factor of 1.5 is applied to the yield stress to give safe working values' (690 / 1.5). SP-413 itself used aluminium ('aluminum is assumed as the principal structural material', working stress 234 MPa at 2,650 kg/m^3): allowable per density steel 41, aluminium 2219-T87 84, carbon/epoxy ~320 kN m/kg, so an aluminium shell would weigh ~0.48 of steel's"
shield:
  dose_target:
    value: 10
    unit: mSv a year inside the shield (galactic cosmic rays, deep space)
    conf: "high"
    source: "Jon's choice (2026-11-06): half the 20 mSv/yr Globus & Strout set for adults ('For adults only the average dose over many years is relevant'), for people who live aboard for life, children included; NASA's 600 mSv career limit is 30 years at 20 mSv/yr, 60 at 10"
  code_factor:
    value: 1.0
    low: 0.77
    high: 1.3
    unit: true dose / OLTARIS dose
    conf: "medium"
    source: "transport codes differ ~30% for free-space doses (Geant3 vs Geant4, Ambroglini et al. 2016); Globus & Strout's doses are for solar minimum ('calculated for a low solar activity period from 17 June 1977 to 17 June 1978 and are thus conservative'; 'about a factor of three difference in the space radiation between solar minima and maxima')"
  water:
    anchor_areal:
      value: 7
      unit: t/m^2 of water, the deepest row of Globus & Strout's Table 2
      conf: "high"
      source: "Globus & Strout 2017 Table 2 (OLTARIS, free space): water 5, 6, 7 t/m^2 -> 43, 26.5, 16.1 mSv/yr"
    anchor_dose:
      value: 16.1
      unit: mSv/yr at anchor_areal
      conf: "high"
      source: "Globus & Strout 2017 Table 2: water 7 t/m^2, '16.1' mSv/yr ('6-7 tons of water or polyethylene radiation shielding per square meter of hull is sufficient in deep space' for 20)"
    efold:
      value: 2.01
      low: 1.9
      high: 2.1
      unit: t/m^2 of water per e-fold of dose
      conf: "medium"
      source: "derived from Table 2: 1 / ln(26.5 / 16.1) = 2.01 (6 -> 7 t/m^2), 1 / ln(43 / 26.5) = 2.07 (5 -> 6); the table stops at 7, so 10 mSv/yr (~8.0 t/m^2) is a 1 t/m^2 extrapolation. The GCR plateau ('Adding more than 20 g/cm2 is not helpful, unless you are adding meters of material', Clowdsley 2021) is far thinner. Water from C-type asteroids ('A 500-t, carbonaceous C-type asteroid may contain up to 100 t of water', KISS 2018), Ceres, icy moons; ~2 MJ/kg to extract at 10% water (Janhunen et al., EMMI)"
  regolith:
    anchor_areal:
      value: 11
      unit: t/m^2 of lunar regolith, the deepest row of Table 2
      conf: "high"
      source: "Globus & Strout 2017 Table 2: regolith 9, 10, 11 t/m^2 -> 34.9, 22.8, 14.5 mSv/yr; 20 mSv/yr 'requires 10-11 tons of lunar regolith per square meter'"
    anchor_dose:
      value: 14.5
      unit: mSv/yr at anchor_areal
      conf: "high"
      source: "Globus & Strout 2017 Table 2: regolith 11 t/m^2, '14.5' mSv/yr"
    efold:
      value: 2.21
      low: 2.0
      high: 2.5
      unit: t/m^2 of regolith per e-fold of dose
      conf: "medium"
      source: "derived from Table 2: 1 / ln(22.8 / 14.5) = 2.21 (10 -> 11 t/m^2), 2.30 (9 -> 10), 2.51 (8 -> 9)"
  active_mass_per_area:
    value: 1.1
    low: 0.4
    high: 6
    unit: t/m^2 of superconducting magnet and structure for a ~30 GV cutoff (an option)
    conf: "low"
    source: "derived (pass 3 researcher) from stored energy (B d)^2 A / (2 mu0 d) at ~100 T m and a 20 m field depth, structure mass >= Q (rho / sigma) E: 0.9-13 Mt of structure + ~0.18 Mt of conductor over the shield's area; checked against SP-413 ch. 4's 'structural mass of about 10 kt' for a 0.5 GeV/nucleon cutoff, which it rejected: 'the structural mass required to resist the magnetic forces between superconducting coils precludes this design'. SR2S: 'At 100 Tm, the field represents 70% of the observed dose reduction' (Ambroglini et al. 2016). Only SP-413 studied one at settlement scale"
  active_residual:
    value: 0.5
    low: 0.2
    high: 1.3
    unit: t/m^2 of hydrogen-rich passive shield still needed with an active shield
    conf: "low"
    source: "judgement between Clowdsley 2021 ('Do not add mass to go beyond 20 g/cm2', 0.2 t/m^2) and SP-413 ch. 4 ('Only the addition of shielding to an extent of 1.3 t/m^2 could reduce the dosage'); 'An active deflector shield system would never be a replacement for passive shielding' (Bamford et al. 2014). A storm shelter (~0.3 t/m^2 of water, ~1.4 kt for 10,000) would be needed with it"
  gap:
    value: 1.5
    low: 1
    high: 5
    unit: m between the spinning tube and the still shield
    conf: "medium"
    source: "SP-413 ch. 5: 'a gap of approximately 1-1/2 m between it and the torus'; ch. 4: 'separated by only a meter or two'"
