# The spinning habitat: a torus (ring) like the Stanford torus, spun for gravity, inside a
# radiation shield that does not spin (as in the Stanford torus design), so the shield's mass
# loads no structure.

gravity_g:
  value: 1.0
  low: 0.8
  high: 1.0
  unit: g (9.80665 m/s^2) at the floor
  conf: "placeholder"
  source: "design target 1 g for a normal life; how much less stays healthy over a lifetime is unknown (research queue)"
rpm:
  value: 2
  low: 1
  high: 3
  unit: revolutions per minute
  conf: "placeholder"
  source: "a comfort limit near 2 rpm is commonly quoted for spinning habitats; to source (research queue)"
volume_per_person:
  value: 5000
  low: 1500
  high: 8000
  unit: m^3 of pressurized volume per person (homes, work, farms, parks, air)
  conf: "placeholder"
  source: "Stanford-torus scale is about 7,500 m^3 a person (130 m tube on a 1.8 km ring for 10,000; to verify against NASA SP-413); lower bound a guess"
interior_mass_per_person:
  value: 50
  low: 20
  high: 150
  unit: t per person (floors, buildings, soil, water, equipment; not the shell or shield)
  conf: "placeholder"
  source: "placeholder: no source yet (research queue)"
air_pressure:
  value: 101.3
  low: 60
  high: 101.3
  unit: kPa
  conf: "placeholder"
  source: "sea level 101.3 kPa; reduced-pressure, oxygen-enriched air saves shell mass (research queue for the lowest healthy value)"
shell:
  density:
    value: 7850
    unit: kg/m^3
    conf: "high"
    source: "structural steel"
  allowable_stress:
    value: 300
    low: 200
    high: 450
    unit: MPa
    conf: "placeholder"
    source: "placeholder: high-strength steel with a safety margin; to set from a code (research queue)"
shield:
  areal_density:
    value: 7
    low: 4.5
    high: 10
    unit: t/m^2
    conf: "placeholder"
    source: "Earth's atmosphere is 10.3 t/m^2 (101.3 kPa / g); the Stanford torus used a slag shield of a few t/m^2 (to verify); the active-shield project could replace this"
  gap:
    value: 5
    low: 2
    high: 20
    unit: m between the spinning tube and the still shield
    conf: "placeholder"
    source: "placeholder: room for the bearing-free gap and access"
air_temperature:
  value: 293
  low: 288
  high: 298
  unit: K
  conf: "medium"
  source: "room temperature; sets the air's mass with air_pressure"
max_tube_ratio:
  value: 0.4
  low: 0.25
  high: 0.5
  unit: largest tube radius / spin radius for one ring; more volume takes more rings
  conf: "placeholder"
  source: "placeholder: the Stanford torus was 0.07; a fat tube puts the inner floor at much lower gravity than the outer"
min_inertia_ratio:
  value: 1.2
  low: 1.2
  high: 1.2
  unit: spin-axis / largest cross-axis moment of inertia, least allowed
  conf: "placeholder"
  source: "placeholder margin above 1 (a body spins stably, with energy loss, only about its largest axis; Explorer 1 tumbled in 1958)"
