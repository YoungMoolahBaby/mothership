# The tour (pass 3): the ship leaves its home orbit round Earth, flies low-thrust legs between the
# planets, spirals down into a parking orbit at each stop and out again (for a moon, first down
# its planet's well to the moon's orbit), and comes home. The itinerary is model.TOUR; its
# delta-v feeds the `tour` and `brisk` scenarios.

acceleration:
  value: 1.0e-4
  low: 5.0e-5
  high: 3.0e-4
  unit: m/s^2, the drive's thrust acceleration on the tour
  conf: "medium"
  source: "derived: the tour's ~70 km/s over 20 years of thrust is ~1.1e-4 m/s^2; Dawn's ion drive gave 'a delta-V of almost 11.5 km/s' over 'approximately 51,250 hours' (Rayman & Garner 2018, NTRS 20210008613), 6.2e-5 on average"
spiral_coefficient:
  value: 0.754
  low: 0.75
  high: 0.76
  unit: c in dv = v0 (1 - c eps^(1/4)), eps = thrust acceleration / local gravity
  conf: "high"
  source: "MIT 16.522 (Space Propulsion, 2015) Lecture 6 p. 4 eq. 18, spiral escape from circular speed v0; its table gives dv/v0 = 0.9245 at eps = 1e-4 and 0.8657 at 1e-3. Edelbaum spirals 'reach escape velocity 15-30% faster' when steered for minimum time (Joosten & White 2014, NTRS 20140013174), so this is conservative"
edelbaum_eps_max:
  value: 0.3
  low: 0.1
  high: 0.5
  unit: thrust acceleration / the Sun's gravity, above which a leg is flown as a Hohmann transfer
  conf: "low"
  source: "judgement (pass 3 researcher): Edelbaum assumes quasi-circular spirals and 'the thrust-to-weight ratio of the EP system must be 10-2 or less' (Oleson, NASA CR-191129, p. 2); at 1e-4 m/s^2 eps is 0.017 at 1 AU, 0.46 at Jupiter, 1.5 at Saturn, where months of thrust against years of coast are nearly impulsive"
park_radius:
  value: 7
  low: 1.1
  high: 7
  unit: parking orbit radius / the body's radius
  conf: "medium"
  source: "pass 3: parking high saves the ship's spirals and the landers pay instead (expeditions); ~7 radii is Deimos's orbit at Mars (23,457 km = 6.9 radii) and about a third of the Hill radius at Callisto (6.9) and Titan (6.8), the most that stays stable (judgement, park within ~1/3 of the Hill radius; Ganymede's is only 12 radii). Low end: low orbits"
low_orbit_radius:
  value: 1.1
  low: 1.05
  high: 1.3
  unit: low orbit radius / the body's radius (where the landers' sortie_dv applies)
  conf: "medium"
  source: "the lander round trips in expeditions.sortie_dv start from low orbits (Apollo's 'insertion into a 9- by 45-nautical-mile orbit', Mars ascent to 500 km); landers carry the transfer between the parking and low orbits themselves (Hohmann)"
home_radius:
  value: 60
  low: 10
  high: 60
  unit: Earth radii, the home orbit
  conf: "low"
  source: "judgement: SP-413 builds the settlement at L5, at the Moon's distance (~60 Earth radii); the spiral out from there is ~0.7 km/s"
