# The crop mix (pass 5): what the aeroponic racks grow for the ship's calories. Each crop's share
# is a share of the calories that come from crops (the rest of the food system is food.yaml);
# shares are a diet design (judgement, after the pass-5 researcher's table), normalised to 1 in
# the model. Yields are BVAD Rev2 / NASA Biomass Production Chamber values (HPS lamps, NFT
# hydroponics) in kcal of food a m^2 of grow area a day, low = poor stands, high = the best
# demonstrated; light is the daily light integral that gave them. kcal/g and protein/g are per
# gram of dry edible mass (USDA FoodData Central SR Legacy). Height is the grown crop (BVAD Table
# 4-90). Sources: NASA BVAD Rev2 (2022) Tables 4-89/4-90/4-92 (pp. 186-190): https://ntrs.nasa.gov/
# api/citations/20210024855/downloads/BVAD_2.15.22-final.pdf; Bugbee & Salisbury 1988 (wheat
# 'grain yield reached ... 60 grams per square meter per day'); Tibbitts & Wheeler 1988 (potato
# '21.9 g m-2 day-1'). No staple crop has a reported yield grown aeroponically to maturity; EDEN
# ISS warns aeroponics may 'lower the harvest index. There is no known literature addressing
# these issues' (D2.5 Design Report p. 138).

wheat:
  share: {value: 0.21, unit: share of crop kcal, conf: "low", source: "diet design (pass 5); wheat takes ~1/3 of crop light for 1/5 of the kcal at BVAD's 115 mol"}
  yield: {value: 75, low: 52, high: 226, unit: kcal/m^2/d, conf: "medium", source: "BVAD 20.00 g dw/m^2/d x 3.76 kcal/g; high Bugbee & Salisbury 1988, 60 g/m^2/d at up to 150 mol"}
  light: {value: 115, unit: mol/m^2/d, conf: "high", source: "BVAD Table 4-90, 20-24 h photoperiod"}
  kcal_per_g: {value: 3.76, unit: kcal/g dw, conf: "high", source: "USDA FDC 168890"}
  protein_per_g: {value: 0.145, unit: g/g dw, conf: "high", source: "USDA FDC 168890"}
  height: {value: 0.5, unit: m, conf: "high", source: "BVAD Table 4-90"}
