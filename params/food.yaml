# The rest of the food system (pass 5): food that isn't LED crops, the specialty gardens (herbs,
# spices, medicinal plants, a tea and coffee grove), the plant-made-medicine facility and the
# nutrient loop. Jon: "food/herbs/spices/medicine are sacred to humans". Shares are of all food
# kcal; crops make the rest. Energy in kWh of electricity a kcal of food (LED crops are ~0.14).
# The diet is ideally vegan/vegetarian (Jon, 2026-11-06): no insects, eggs or fish; B12 from
# bacterial fermentation, vitamin D from UV-B or fermentation, iodine from seaweed.

scp:
  share: {value: 0.10, low: 0.0, high: 0.30, unit: share of kcal, conf: "low", source: "judgement (pass 5); capped by nucleic acid: SCP needs an RNA-reduction step like Quorn's ('above 68C (optimum 72-74C) for 30 to 45 minutes', Wiebe 2004)"}
  kwh_per_kcal: {value: 0.0066, low: 0.003, high: 0.010, unit: kWh/kcal, conf: "medium", source: "hydrogen-oxidising bacteria on cabin CO2: electrolysis 'with an ηec of 70%', 'ηbio of 32%', biomass '20 MJ kg-dw-1' (Leger et al. 2021, PNAS) -> 28-32 kWh/kg dw with support; Sillman et al. 2020: 9.86-25 kWh/kg; at ~3,800 kcal/kg dw (judgement). Solar Foods (company): 'the efficiency of converting electricity to calories is about 20%' (0.0058)"}
  protein_per_kcal: {value: 0.171, low: 0.145, high: 0.197, unit: g protein/kcal, conf: "medium", source: "'the usable cellular protein content lies between 55 to 75% on a dry mass basis' (Leger et al. 2021) at ~3,800 kcal/kg dw (judgement)"}
fungi:
  share: {value: 0.06, low: 0.03, high: 0.08, unit: share of kcal, conf: "low", source: "derived (pass 5): crop waste ~0.36 kg dry per 1,000 kcal (BVAD Table 4-92: 6.66 kg/CM-d fresh inedible at 90% water for 1,850 kcal) grows mushrooms (biological efficiency 0.75 kg fresh per kg dry substrate, low end of 'P. ostreatus (157.9%)', Ramos et al. 2010, and button 52-176%, Grimm & Wosten 2018) and, from the spent substrate's sugar, mycoprotein (F. venenatum 136 g protein per kg glucose, Moore): ~6% of kcal, ~30% of protein"}
  kwh_per_kcal: {value: 0.005, low: 0.001, high: 0.03, unit: kWh/kcal, conf: "low", source: "industrial button mushrooms, heating and cooling only, '0.22 kWh/kg' (Beghi et al. 2020), x1.5-4 for sterilising and fans (judgement); the substrate is waste"}
  protein_per_kcal: {value: 0.11, low: 0.08, high: 0.15, unit: g protein/kcal, conf: "low", source: "mushrooms 'low in calories (27-30 kcal/100 g)' (Grimm & Wosten 2018) at ~3% protein (USDA, not fetched); mycoprotein 'typically contains 44% protein' (Moore)"}
  shelf_area: {value: 1.5, low: 0.5, high: 3.0, unit: m^2 a person, conf: "low", source: "judgement: 6-week cycles at ~15 kg/m^2 (button 'a yield of 7.6 kg m-2' to '26 kg m-2', Grimm & Wosten 2018)"}
dairy:
  share: {value: 0.04, low: 0.0, high: 0.08, unit: share of kcal, conf: "low", source: "judgement (pass 5): precision-fermented whey and casein for cheese, yogurt and ice cream, made by microbes with no animals (fits Jon's vegan/vegetarian diet)"}
  kwh_per_kcal: {value: 0.05, low: 0.01, high: 0.7, unit: kWh/kcal, conf: "low", source: "Perfect Day's own LCA (WSP, company-commissioned): 'One kg of Perfect Day whey protein requires 13 kWh of electricity to produce'; the glucose input is not disclosed: ~0.7 kWh/kcal if the sugar came from LED crops, 0.01-0.05 on carbon from waste or CO2 (judgement)"}
  protein_per_kcal: {value: 0.2, low: 0.15, high: 0.22, unit: g protein/kcal, conf: "medium", source: "whey and casein protein ~4 kcal/g at ~80% protein (judgement)"}
algae:
  share: {value: 0.02, low: 0.01, high: 0.05, unit: share of kcal, conf: "low", source: "judgement (pass 5); algal DHA for omega-3; not B12: cyanobacteria 'are not suitable for use as sources of Vitamin B12 for vegetarians' (Watanabe et al. 2014)"}
  kwh_per_kcal: {value: 0.062, low: 0.031, high: 0.12, unit: kWh/kcal, conf: "low", source: "derived: 'a biomass yield on light energy of 0.78 and 0.75 g mol photons-1' (Zijffers et al. 2010) at ~7.45 mol of photons a kWh -> 179 kWh/kg dw, ~2,900 kcal/kg (USDA spirulina, not fetched)"}
  protein_per_kcal: {value: 0.2, low: 0.15, high: 0.22, unit: g protein/kcal, conf: "low", source: "spirulina ~57% protein at ~2.9 kcal/g (USDA, not fetched)"}
insects:
  share: {value: 0.0, unit: share of kcal, conf: "high", source: "Jon's choice (2026-11-06): the diet is ideally vegan/vegetarian, so no insects (mealworms on waste would be ~0.005 kWh/kcal, the figures below kept for reference)"}
  kwh_per_kcal: {value: 0.005, low: 0.002, high: 0.02, unit: kWh/kcal, conf: "low", source: "Oonincx & de Boer 2012: 'The EU of one kg of fresh mealworms was 34 MJ', '35% from gas used for heating' (free aboard): ~2 kWh/kg fresh on waste feed (judgement)"}
  protein_per_kcal: {value: 0.21, low: 0.15, high: 0.23, unit: g protein/kcal, conf: "medium", source: "'protein and fat contents of the larvae were 76.14% and 6.44% on dry weigh basis' (Li, Zhao & Liu): 0.76 / (0.76 x 4 + 0.064 x 9) = 0.21"}
animals:
  share: {value: 0.0, unit: share of kcal, conf: "high", source: "Jon's choice (2026-11-06): the diet is ideally vegan/vegetarian, so no eggs or fish (fed from crops each 1% of kcal would cost ~9 MW: the figures below kept for reference)"}
  kwh_per_kcal: {value: 0.8, low: 0.17, high: 2.1, unit: kWh/kcal, conf: "low", source: "fed on LED crops: eggs keep 17% of feed calories (Shepon et al. 2016, Table 1) -> 0.145 / 0.17 = 0.85; tilapia 'the lowest mean calorie retention ... 7%' (Fry et al. 2018) -> 2.1; low end on waste. Cultivated meat ~250 kWh/kg on crop sugar (Sinke et al. 2023 baseline) is worse than the plants"}
  protein_per_kcal: {value: 0.1, low: 0.08, high: 0.2, unit: g protein/kcal, conf: "low", source: "eggs ~0.09, white fish ~0.2 g/kcal (judgement from USDA)"}
garden:
  herbs_area: {value: 0.12, low: 0.05, high: 0.3, unit: m^2 a person, conf: "medium", source: "derived (pass 5): ~2 kg a person a year (0.3-4; 'German consumers buy over 300 grams of culinary herbs per year', CBI) / ~25 kg/m^2/yr (basil 2.1-3.2 kg/m^2 a cut on 28-day cycles; Pennisi et al. 2020: 'optimal when DLI is 14 mol m-2 d-1')"}
  herbs_light: {value: 14, low: 12, high: 20, unit: mol/m^2/d, conf: "high", source: "Pennisi et al. 2020: 'chicory, basil and rocket were optimal when DLI is 14 mol m-2 d-1 at a photoperiod of 16 h d-1'"}
  spices_area: {value: 1.0, low: 0.4, high: 2.5, unit: m^2 a person, conf: "low", source: "derived (pass 5): ~1.5 kg a person a year ('the apparent per capita consumption of spices averaged 3.4 pounds', USDA via Mississippi State) at saffron ~15 g/m^2/yr in stacked racks, ginger ~15 kg/m^2/yr, chili ~18 kg/m^2/yr; seed spices (cumin, coriander, mustard, sesame) take most of it; cinnamon, black pepper and vanilla are trees and vines with no indoor yields"}
  spices_light: {value: 20, low: 4, high: 30, unit: mol/m^2/d, conf: "low", source: "saffron forcing ~3.6 mol ('100 umol m-2 s-1', '10-h light', Gao et al. 2023) to chili and seed crops ~25-30 (judgement)"}
  medicinal_area: {value: 0.2, low: 0.1, high: 0.5, unit: m^2 a person, conf: "low", source: "judgement (pass 5): root medicinals ('Aeroponics appeared to be the most productive system in CE for medicinal crops where the herb (leaves and flowers) or roots were harvested', Hayden 2006; burdock ~0.9 kg dw/m^2/yr derived), Artemisia, mints, alkaloid plots; UV-B gave no reliable artemisinin gain ('Artemisinin concentration was hardly affected by the spectrum of supplemental radiation', Frontiers 2022)"}
  medicinal_light: {value: 20, low: 12, high: 30, unit: mol/m^2/d, conf: "low", source: "judgement"}
  grove_area: {value: 3, low: 1, high: 20, unit: m^2 a person, conf: "low", source: "judgement (pass 5): tea is plausible indoors (optimum 'about 150 umol m-2 s-1 with a photoperiod of 20:4', Agronomy 2022); coffee has no controlled-environment data and cacao only company R&D (Cargill/AeroFarms 2021): perhaps the ship's hardest foods"}
  grove_light: {value: 11, low: 8, high: 25, unit: mol/m^2/d, conf: "low", source: "tea: 150 umol x 20 h = 10.8 mol/m^2/d (Agronomy 2022)"}
  grove_height: {value: 2.5, low: 1.5, high: 3.5, unit: m, conf: "low", source: "judgement: pruned tea, dwarf coffee and cacao"}
  specialty_height: {value: 0.6, low: 0.3, high: 1.0, unit: m, conf: "low", source: "basil and greens ~0.3 m, chili and medicinal herbs ~0.6-1 (judgement)"}
pharma:
  grow_area: {value: 60, low: 30, high: 150, unit: m^2 of Nicotiana benthamiana for the ship, conf: "medium", source: "derived (pass 5): 1 kg of purified protein a year at '1 g mAb/kg fresh weight' and 65% recovery (techno-economic model) needs 1,540 kg of leaf a year, ~25 kg/m^2/yr: 62 m^2; transient expression 'yielding up to 3-5 g/kg of FW', 'usually within 4 to 7 days' (Akher et al. 2025); Health Canada approved the plant-made vaccine Covifenz in 2022"}
  power_kw: {value: 30, low: 15, high: 80, unit: kW, conf: "low", source: "derived: lighting ~7 kW (62 m^2 x 110 W/m^2) x 3-4 for infiltration, purification, clean rooms and analytics (judgement). Small molecules (antibiotics, anaesthetics, most analgesics) still need a chemistry line and fermenters (judgement)"}
loop:
  power_w: {value: 30, low: 10, high: 80, unit: W a person, conf: "low", source: "judgement (pass 5): aeration ~10-20 W, water ~5-20 W; urine nitrification at 'nitrogen conversions in the order of 95-100% efficiency' (MELiSSA, Verbeelen et al. 2021), biomass bioreactors whose 'effluents supplied at least half of the crops elemental mass needs' (Mackowiak et al. 1996), struvite recovering 'more than 90% of phosphate' (Etter et al. 2011)"}
  volume: {value: 0.25, low: 0.06, high: 0.6, unit: m^3 a person, conf: "low", source: "derived: nitrifier 15 g N a day / 1.35 kg N/m^3/d (MELiSSA) x 3 = 0.03 m^3, biomass reactor ~0.2 (judgement)"}
  closure: {value: 0.95, low: 0.80, high: 0.99, unit: fraction of crop nutrients recycled, conf: "low", source: "Lunar Palace 365 (preprint): 'material closure degree of 98.2%', 'the recovery rate of urine and solid waste achieved 99.7% and 67%'; BVAD p. 177: '90 to 100 kg of fertilizer salt might be required per person per year ... > 50% of these nutrients could be recycled'"}
  fertiliser: {value: 95, low: 90, high: 100, unit: kg of nutrient salts a person a year, conf: "medium", source: "BVAD Rev2 p. 177: '90 to 100 kg of fertilizer salt might be required per person per year (Lunn, et al., 2017)'"}
