[project]
name = "mothership"
version = "0.1.0"
description = "Sizing model for a lifetime space mothership: habitat, shielding, life support, fusion power, radiators, propulsion"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pyyaml>=6"]

[project.scripts]
mothership = "mothership.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mothership"]
